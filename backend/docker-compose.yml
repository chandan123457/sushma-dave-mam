services:
  db:
    image: postgres:17-alpine
    container_name: sushma-dave-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sushma
      POSTGRES_PASSWORD: sushma_dev_pw
      POSTGRES_DB: sushma_portfolio
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sushma -d sushma_portfolio"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
